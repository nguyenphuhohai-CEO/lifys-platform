# Un déploiement 100 % indépendant par site (base, disque et secrets séparés).
# Domaines suggérés : amis.lifys.com, love.lifys.com, ephemere.lifys.com, mariage.lifys.com, pro.lifys.com
services:
  - type: web
    name: lifys-amis
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: lifys-amis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_ONLY
        value: amical
      - key: DATABASE_FILE
        value: /data/lifys.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false # ex. https://amis.lifys.com
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: Lifys Amis <no-reply@lifys.com>
      - key: ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PREMIUM_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
