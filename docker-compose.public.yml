services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-lifys_csrf_token}
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:-postgres://lifys:${POSTGRES_PASSWORD}@postgres:5432/lifys}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-30000}
      DATABASE_POOL_CONNECTION_TIMEOUT_MS: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:-10000}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      COOKIE_SECURE: true
      CORS_ORIGIN: ${CORS_ORIGIN}
      DEMO_DISCOVERY_ENABLED: false
      TRUST_PROXY: true
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_REQUESTS: ${LOG_REQUESTS:-true}
      STATIC_ASSET_MAX_AGE_SECONDS: ${STATIC_ASSET_MAX_AGE_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health',{headers:{'x-forwarded-proto':'https'}}).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: lifys
      POSTGRES_USER: lifys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifys -d lifys"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - lifys-postgres:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    image: postgres:17-bookworm
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://lifys:${POSTGRES_PASSWORD}@postgres:5432/lifys}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -lc
    command: >
      mkdir -p /backups &&
      pg_dump --format=custom --clean --if-exists
      --file "/backups/lifys-$$(date +%F-%H%M%S).dump"
      "$$DATABASE_URL"
    restart: "no"

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/fullchain.pem}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/certs/privkey.pem}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.public.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/acme:/var/www/certbot
    command: >
      /bin/sh -lc
      "envsubst '$$APP_DOMAIN $$TLS_CERT_PATH $$TLS_KEY_PATH'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf &&
      exec nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  lifys-postgres:
